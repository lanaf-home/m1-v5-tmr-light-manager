name: Build Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python (x64)
        if: matrix.arch == 'x64'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: 'x64'
      
      - name: Set up Python (x86)
        if: matrix.arch == 'x86'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: 'x86'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flask hidapi psutil pystray pillow
      
      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --noconsole `
            --name m1v5tmr_light_manager `
            --icon=NONE `
            --hidden-import=flask `
            --hidden-import=hid `
            --hidden-import=psutil `
            --hidden-import=pystray `
            --hidden-import=pystray._win32 `
            --hidden-import=PIL `
            --hidden-import=PIL.Image `
            --hidden-import=PIL.ImageDraw `
            --add-data "gui.html;." `
            server.py
      
      - name: Create release package
        shell: powershell
        run: |
          $arch = "${{ matrix.arch }}"
          $zipName = "m1v5tmr_light_manager_${arch}.zip"
          $exePath = "dist\m1v5tmr_light_manager.exe"
          $guiPath = "gui.html"
          
          # Create temp directory for packaging
          New-Item -ItemType Directory -Path "package_temp" -Force
          Copy-Item $exePath "package_temp\"
          Copy-Item $guiPath "package_temp\"
          
          # Create zip file
          Compress-Archive -Path "package_temp\*" -DestinationPath $zipName -Force
          
          echo "Created: $zipName"
          dir $zipName
      
      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            m1v5tmr_light_manager_${{ matrix.arch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
